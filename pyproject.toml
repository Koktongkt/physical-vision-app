[project]
name = "physical-vision-contracts"
version = "0.1.0"
description = "Executable contract validation for the localhost physical vision prototype"
requires-python = ">=3.11,<3.15"
dependencies = [
  "jsonschema==4.25.1",
  "pillow==12.3.0",
]

[dependency-groups]
dev = [
  "pytest==8.4.1",
  "ruff==0.12.7",
]

[tool.uv]
required-version = "==0.11.31"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = [
  "packages/contracts/python",
  "packages/policy/python",
  "packages/vision/python",
]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
