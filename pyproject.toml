[project]
name = "physical-vision-contracts"
version = "0.1.0"
description = "Executable contract validation for the localhost physical vision prototype"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi==0.116.1",
  "jsonschema==4.25.1",
  "numpy==2.2.6",
  "opencv-python-headless==4.12.0.88",
  "pillow==12.3.0",
  "python-multipart==0.0.20",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
# Optional real-engine OCR stack. Not installed by default CI (`uv sync --frozen`).
# Unit tests stay stub-first; integration tests skip when these packages are absent
# or when PHYSICAL_VISION_PADDLE_OCR=0.
paddle-ocr = [
  "paddleocr==3.7.0",
  "paddlepaddle==3.3.1",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "ruff==0.12.7",
]

[tool.uv]
required-version = "==0.11.31"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = [
  "packages/contracts/python",
  "packages/policy/python",
  "packages/study/python",
  "packages/vision/python",
  "services/api/python",
]
addopts = "--strict-markers --strict-config"
markers = [
  "integration: optional tests requiring external OCR stack (e.g. PaddleOCR)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
